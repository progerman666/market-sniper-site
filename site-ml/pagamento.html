<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Pagamento — Ganancia ML</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #0b1f3a; padding: 24px; max-width: 500px; margin: 0 auto; line-height: 1.6; }
    .box { border: 1px solid #ddd; border-radius: 12px; padding: 24px; margin-top: 16px; }
    .usdt { font-size: 18px; font-weight: 700; color: #0b7a3b; font-family: monospace; word-break: break-all; background:#f4f6f8; padding: 10px; border-radius: 8px; display:block; margin: 12px 0; }
    .btn { display: inline-block; background: #0b1f3a; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; border:none; cursor:pointer; width:100%; }
    .key { background: #e8f5ec; border: 1px solid #0b7a3b; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; word-break: break-all; margin-top: 16px; display:none; }
  </style>
</head>
<body>
  <h2>Pagar acesso vitalício</h2>
  <p>Envie <strong>USDT (TRC20)</strong> para o endereço abaixo. Após a confirmação, sua chave de ativação será gerada.</p>

  <div class="box">
    <label>Endereço USDT (TRC20):</label>
    <span class="usdt" id="usdt">TUSeuEnderecoAqui...</span>
    <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('usdt').textContent); alert('Copiado!');">Copiar endereço</button>
  </div>

  <button class="btn" onclick="confirmar()">Já efetuei o pagamento</button>

  <div id="keybox" class="key">
    <strong>Sua chave:</strong><br>
    <span id="license-key"></span><br>
    <small>Cole esta chave na extensão Ganancia ML (popup → Chave de acesso → OK).</small>
  </div>

  <script>
    function confirmar() {
      document.getElementById('keybox').style.display = 'block';
      document.getElementById('license-key').textContent = 'MS1.AGUARDANDO_CONFIRMACAO';
      alert('Aguardo confirmação do pagamento. Entre em contato para receber a chave gerada.');
    }
  </script>
</body>
</html>
