<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ganancia Mercado Libre</title>
  <style>
    body { width: 360px; margin: 0; padding: 12px; color: #0b1f3a;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    button { width: 100%; padding: 8px; cursor: pointer; border: 0; border-radius: 8px;
             background: #0b1f3a; color: #fff; font-weight: 600; }
    button:disabled { opacity: .6; cursor: default; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
    td { padding: 3px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
    td:first-child { color: #667; width: 46%; }
    td.profit { font-weight: 700; color: #0b7a3b; }
    td.loss { font-weight: 700; color: #c0392b; }
    .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
    .row label { flex: 0 0 112px; font-size: 12px; color: #555; }
    .row input, .row select { flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px;
                              border: 1px solid #ccc; border-radius: 6px; }
    .tools { display: flex; gap: 6px; margin-top: 8px; }
    .tools button { background: #f1f4f9; color: #0b1f3a; font-size: 11px; padding: 6px 8px; }
    #hint { font-size: 11px; color: #777; margin-top: 6px; line-height: 1.35; }
    #out { font-size: 11px; color: #c0392b; margin-top: 6px; white-space: pre-wrap; }
    .status { font-size: 11.5px; padding: 6px 8px; border-radius: 8px; margin-bottom: 8px; line-height: 1.35; }
    .status-pro { background: #e8f5ec; color: #0b7a3b; }
    .status-trial { background: #fff6e5; color: #8a5a00; }
    .status-expired { background: #fdecea; color: #b03a2e; }
    .row .mini { flex: 0 0 auto; width: auto; padding: 4px 10px; font-size: 12px;
                 background: #0b1f3a; color: #fff; }
    .license { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; }
    #license-msg { font-size: 11px; color: #c0392b; margin-top: 4px; line-height: 1.3; }
    .buy { display: block; margin-top: 6px; text-align: center; font-size: 12px; color: #0b1f3a; }
  </style>
</head>
<body>
  <h3>Ganancia ML</h3>
  <div id="status" class="status"></div>
  <button id="collect">Mostrar cálculo</button>
  <table id="data"></table>
  <div id="out"></div>

  <div class="row">
    <label>País</label>
    <select id="country">
      <option value="BR">Brasil (R$)</option>
      <option value="AR">Argentina ($)</option>
      <option value="MX">México ($)</option>
      <option value="CO">Colômbia ($)</option>
      <option value="CL">Chile ($)</option>
      <option value="PE">Peru (S/)</option>
      <option value="UY">Uruguai ($U)</option>
    </select>
  </div>
  <div class="row">
    <label>Preço de venda</label>
    <input id="price" type="number" step="1" min="0" placeholder="se a página não carregou" />
  </div>
  <div class="row">
    <label>Comissão ML, %</label>
    <input id="commission" type="number" step="0.1" min="0" max="95" />
  </div>
  <div class="row">
    <label>Custo fixo por unidade</label>
    <input id="fixedFee" type="number" step="1" min="0" />
  </div>
  <div class="row">
    <label>Frete</label>
    <input id="logistics" type="number" step="1" min="0" />
  </div>
  <div class="row">
    <label>Publicidade</label>
    <input id="ads" type="number" step="1" min="0" />
  </div>
  <div class="row">
    <label>Custo do produto</label>
    <input id="cost" type="number" step="1" min="0" placeholder="compra ao fornecedor" />
  </div>
  <div class="row">
    <label>Impostos (ICMS), %</label>
    <input id="icms" type="number" step="0.1" min="0" max="50" />
  </div>

  <div class="tools">
    <button id="apply-category" type="button">Tarifa ML</button>
    <button id="reset" type="button">Redefinir</button>
  </div>
  <div id="hint"></div>

  <div class="license">
    <div class="row">
      <label>Chave de acesso</label>
      <input id="license-key" type="text" placeholder="ML1.…" spellcheck="false" autocomplete="off" />
      <button id="activate" class="mini" type="button">OK</button>
    </div>
    <div id="license-msg"></div>
    <a id="buy" class="buy" target="_blank" rel="noopener">Contratar versão completa</a>
  </div>

  <script src="rates.js"></script>
  <script src="license.js"></script>
  <script src="popup.js"></script>
</body>
</html>
